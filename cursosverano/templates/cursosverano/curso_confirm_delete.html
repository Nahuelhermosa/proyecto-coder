{% extends "core/index.html" %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-header bg-danger text-white text-center rounded-top-4">
      <h3>Eliminar Curso</h3>
    </div>
    <div class="card-body text-center">
      <p>¿Estás seguro de que querés eliminar el curso <strong>{{ object.nombre }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'cursosverano:listar-cursos' %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
